# fly.toml app configuration file generated for cancer-to-hell-api on 2026-05-01T00:49:16-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cancer-to-hell-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  GIN_MODE = 'release'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
